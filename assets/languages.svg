<svg xmlns="http://www.w3.org/2000/svg" width="420" height="288" viewBox="0 0 420 288" role="img" aria-label="Most used languages">
<style>
  .bg { fill: #ffffff; stroke: #d0d7de; }
  .title { fill: #1f2328; font: 600 16px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .label { fill: #1f2328; font: 500 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .pct { fill: #59636e; font: 500 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .track { fill: #eaeef2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; stroke: #30363d; }
    .title, .label { fill: #e6edf3; }
    .pct { fill: #9198a1; }
    .track { fill: #21262d; }
  }
</style>
