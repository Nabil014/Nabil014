<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="GitHub contributions in the last year">
<style>
  .bg { fill: #ffffff; stroke: #d0d7de; }
  .title { fill: #1f2328; font: 600 16px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .big { fill: #6366F1; font: 700 30px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .sub { fill: #59636e; font: 500 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .label { fill: #1f2328; font: 500 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .val { fill: #1f2328; font: 600 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .line { stroke: #eaeef2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; stroke: #30363d; }
    .title, .label, .val { fill: #e6edf3; }
    .big { fill: #818CF8; }
    .sub { fill: #9198a1; }
    .line { stroke: #21262d; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="419" height="259" rx="10"/>
<text class="title" x="24" y="36">Contribution Stats</text>
<text class="big" x="24" y="76">1,096</text>
<text class="sub" x="102" y="76">contributions in the last year, private included</text>
<line class="line" x1="24" y1="92" x2="396" y2="92"/>
<text class="label" x="24" y="111">Commits</text>
<text class="val" x="396" y="111" text-anchor="end">753</text>
<line class="line" x1="24" y1="122" x2="396" y2="122"/>
<text class="label" x="24" y="141">Pull requests</text>
<text class="val" x="396" y="141" text-anchor="end">41</text>
<line class="line" x1="24" y1="152" x2="396" y2="152"/>
<text class="label" x="24" y="171">Code reviews</text>
<text class="val" x="396" y="171" text-anchor="end">298</text>
<line class="line" x1="24" y1="182" x2="396" y2="182"/>
<text class="label" x="24" y="201">Issues</text>
<text class="val" x="396" y="201" text-anchor="end">0</text>
<line class="line" x1="24" y1="212" x2="396" y2="212"/>
<text class="label" x="24" y="231">Repositories contributed to</text>
<text class="val" x="396" y="231" text-anchor="end">45</text>
</svg>
